; Worker de la cola. setup-server.sh reemplaza __APP_DIR__ y la copia a
; /etc/supervisor/conf.d/cfdi-worker.conf. deploy.sh lo reinicia con `php artisan queue:restart`.
[program:cfdi-worker]
command=/usr/bin/php __APP_DIR__/artisan queue:work --sleep=3 --tries=1 --max-time=3600
user=www-data
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stopwaitsecs=3600
