# Plantilla del sitio de Nginx. setup-server.sh reemplaza __DOMAIN__, __APP_DIR__ y __PHP__ y la
# copia a /etc/nginx/sites-available/cfdi. `certbot --nginx` le agrega después el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__/public;

    index index.php;
    charset utf-8;

    # Un apoyo sube hasta 5 documentos de 10 MB.
    client_max_body_size 60M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Los ZIP de XML descargan de Facturapi uno por uno.
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
